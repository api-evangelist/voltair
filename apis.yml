aid: voltair
name: Voltair
description: >-
  Voltair (Y Combinator W26, San Francisco) is building a globally distributed
  network of autonomous drones for Earth observation, starting with power
  utilities. Its long-range, weatherized Faraday-1 aircraft recharge on
  Lighthouse-1 pads installed at utility substations and capture
  high-resolution RGB, radiometric thermal, and LiDAR data for asset
  inspection, LiDAR corridor mapping, post-storm damage assessment, and rapid
  fault localization. The Voltair API is an organization-scoped infrastructure
  inspection platform covering sites, assets, defects, clusters, missions,
  visits, media, inspections, an audit/undo transaction log, API keys, and
  signed webhooks.
