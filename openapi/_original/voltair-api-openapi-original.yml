              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [data, transactionId]
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/MissionMedia'
                      - type: object
                        required: [uploadUrl]
                        properties:
                          uploadUrl:
                            type: string
                            description: Presigned PUT URL valid for a short window.
                  transactionId:
                    type: string
                    format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /media/download-url:
    post:
      tags: [Media]
      operationId: createMediaDownloadUrl
      summary: Issue a signed URL for the mission-zip download
      description: |
        Returns a short-lived HMAC-signed URL pointing at /media/download.zip
        that carries its own auth proof in the query string, so a plain
        `<a href download>` click in the browser can trigger the download
        without forging an Authorization header.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMediaDownloadUrlRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [url, expiresAt]
                    properties:
                      url:
                        type: string
                      expiresAt:
                        type: string
                        format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /media/download.zip:
    get:
      tags: [Media]
      operationId: downloadMissionMediaZip
      summary: Download all (optionally filtered) mission media as a streaming zip
      description: |
        Streams a zip archive containing the original media files for a mission.
        The archive is generated server-side by fetching each object directly
        from S3 — no client-side file-count limits or cross-origin navigation.
        Entries are organised as `<siteName>/<ISO-timestamp>.<ext>` with
        unassigned media grouped under `_unassigned/`.
      parameters:
        - name: missionId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: siteId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Restrict to a single site.
        - name: mediaIds
          in: query
          required: false
          schema:
            type: string
          description: |
            Comma-separated list of media UUIDs. Overrides `siteId` when set;
            the zip contains exactly these rows, ordered by site and capture time.
        - name: includeEvidenceCrops
          in: query
          required: false
          schema:
            type: string
            enum: ['true']
          description: |
            When `true`, annotated evidence crops (original photo cropped
            around each defect_evidence bbox with a priority-colored
            stroke) are rendered on demand and appended under `evidence/`.
            Opt-in because rendering is CPU-bound and extends the download.
            On the signed-URL path the flag is covered by the HMAC claims.
      responses:
        '200':
          description: Streaming zip archive
          headers:
            Content-Disposition:
              schema:
                type: string
                example: 'attachment; filename="mission-<uuid>.zip"'
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /media/{mediaId}/download:
    parameters:
      - name: mediaId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [Media]
      operationId: downloadMissionMediaSingle
      summary: Download a single media object
      description: |
        Streams the original S3 object for a single media row with an
        `attachment` Content-Disposition header. Used by the demo-ui
        lightbox and inspection-row download buttons to avoid the CORS
        and cross-origin `<a download>` limitations of going directly
        to CloudFront.
      responses:
        '200':
          description: Raw media bytes
          headers:
            Content-Disposition:
              schema:
                type: string
                example: 'attachment; filename="2026-04-18T00-12-34Z-6c858984.JPG"'
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          description: Upstream S3 read failed
        '500':
          $ref: '#/components/responses/InternalError'

  /defect-evidence/{evidenceId}/download:
    parameters:
      - name: evidenceId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [Media]
      operationId: downloadDefectEvidence
      summary: Download the annotated evidence crop for a defect_evidence row
      description: |
        Renders the downloadable artifact for one defect_evidence row on
        demand. When the row carries a bbox, the response is the ORIGINAL
        photo cropped to a square window with 30% margin around the bbox and
        the bbox stroked in the defect's priority color — exactly what the
        platform's evidence viewer shows on screen. When the row has no bbox
        (non-CVAT-sourced evidence), the original object is streamed
        unmodified. Replaces the retired stored crop derivatives.
      responses:
        '200':
          description: Annotated crop JPEG (or the original object when no bbox)
          headers:
            Content-Disposition:
              schema:
                type: string
                example: 'attachment; filename="annotated-2026-04-18T00-12-34Z-6c858984.jpg"'
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          description: Upstream S3 read failed
        '500':
          $ref: '#/components/responses/InternalError'

  /media/{mediaId}:
    parameters:
      - name: mediaId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [Media]
      operationId: getMedia
      summary: Get media item
      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/MissionMedia'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /media/{mediaId}/comments:
    parameters:
      - name: mediaId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [Media]
      operationId: listMediaComments
      summary: List comments on a media item
      description: |
        Returns the comments attached to a media item in chronological
        (oldest-first) order. Each comment's `actor` is expanded; for
        actor.type == "user", the `actor.user` object contains the first
        name, last name, and email of the commenter.
      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MediaComment'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [Media]
      operationId: createMediaComment
      summary: Add comment to media
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMediaCommentRequest'
      responses:
        '201':
          description: Created
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [data, transactionId]
                properties:
                  data:
                    $ref: '#/components/schemas/MediaComment'
                  transactionId:
                    type: string
                    format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  # ---------------------------------------------------------------------------
  # Inspections (flat)
  # ---------------------------------------------------------------------------
  /inspections:
    get:
      tags: [Inspections]
      operationId: listInspections
      summary: List site inspections
      description: >-
        Returns SiteInspection records for the caller's organization. All filter
        parameters are optional; row-level security confines results to the
        caller's organization.
      parameters:
        - name: siteId
          in: query
          schema:
            type: string
            format: uuid
          description: Restrict to inspections for a single site.
        - name: missionId
          in: query
          schema:
            type: string
            format: uuid
          description: Restrict to inspections for a single mission.
        - name: assetId
          in: query
          schema:
            type: string
            format: uuid
          description: Restrict to inspections that contain at least one asset inspection for this asset.
        - name: hasComments
          in: query
          schema:
            type: boolean
          description: >-
            When `true`, restrict to inspections that have at least one comment
            on any associated media (site-level via `site_inspection_media`, or
            asset-level via the site's `asset_inspections`). Any other value is
            treated as absent.
        - name: siteName
          in: query
          schema:
            type: string
          description: >-
            Case-insensitive substring match (ILIKE) on the joined site's
            `name`. Pass plain text; the server wraps it with `%` on both
            sides.
        - name: siteType[]
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum:
                [distribution_pole, transmission_pole, substation,
                 transmission_line, distribution_line, pipeline, railway,
                 road, other]
          description: >-
            Repeating allowlist on the joined site's `site_type`. Empty/absent
            means any.
        - name: geometryType[]
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum: [Point, LineString, Polygon]
          description: >-
            Repeating GeoJSON geometry-type allowlist on the joined site's
            geometry (mapped to `ST_GeometryType` internally). Empty/absent
            means any.
        - name: priority[]
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum: [high, medium, low, none]
          description: >-
            Repeating allowlist on the denormalized `sites.priority` column
            (`none` also matches a NULL priority). Empty/absent means any.
        - name: resolution[]
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum: [all_resolved, some_resolved, none_resolved]
          description: >-
            Repeating allowlist bucketing each site inspection by its
            defects' `workDoneAt` flags: `all_resolved` (every defect
            resolved), `some_resolved` (a mix), `none_resolved` (at least one
            defect, none resolved). Site inspections with zero defects
            match no bucket and are excluded when this filter is active.
        - name: review[]
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
              enum: [all_reviewed, some_reviewed, none_reviewed]
          description: >-
            Repeating allowlist bucketing each site inspection by its
            defects' `reviewedAt` flags: `all_reviewed` (every defect
            reviewed), `some_reviewed` (a mix), `none_reviewed` (at least one
            defect, none reviewed). Site inspections with zero defects
            match no bucket and are excluded when this filter is active.
        - name: includeUncapturable
          in: query
          schema:
            type: boolean
          description: >-
            When `true`, additionally returns synthesized placeholder
            SiteInspection rows for mission sites tagged `inaccessible`
            that have no persisted inspection (no media was captured).
            Requires `missionId`; sending it without `missionId` is a
            `400`. Placeholder rows carry `not_capturable: true`, reuse the
            site's id, and expand a `site` whose `tags` include
            `inaccessible`. They pass through the same filters and
            pagination as real rows.
        - $ref: '#/components/parameters/MediaSourceFilter'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
