  # ---------------------------------------------------------------------------
  # Site Visits (read-only)
  # ---------------------------------------------------------------------------
  /site-visits:
    get:
      tags: [SiteVisits]
      operationId: listSiteVisits
      summary: List site visits for a mission
      description: |
        Returns site visits for the given mission. When `compress=true`, returns
        a mixed array of the highest-level ClusterVisit and unclustered SiteVisit
        objects instead of the paginated list. Each item in the compressed
        response includes a `type` discriminator field (`"clusterVisit"` or
        `"siteVisit"`).
      parameters:
        - name: missionId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: compress
          in: query
          schema:
            type: boolean
          description: >
            When true, returns a compressed representation: a mixed array of
            the highest-level ClusterVisit objects (whose parent cluster has no
            ClusterVisit in this mission) and unclustered SiteVisit objects.
            Pagination parameters are ignored when compress=true.
        - name: unclustered
          in: query
          schema:
            type: boolean
          description: When true, returns only visits where clusterVisitId is null
        - name: status
          in: query
          schema:
            type: string
          description: Comma-separated statuses
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [data, meta]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/SiteVisit'
                      meta:
                        $ref: '#/components/schemas/PaginationMeta'
                  - $ref: '#/components/schemas/CompressedVisitsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /site-visits/{siteVisitId}:
    parameters:
      - name: siteVisitId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [SiteVisits]
      operationId: getSiteVisit
      summary: Get site visit
      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
