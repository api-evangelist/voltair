    parameters:
      - name: webhookId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [Webhooks]
      operationId: listWebhookDeliveries
      summary: List webhook deliveries
      parameters:
        - name: event
          in: query
          schema:
            type: string
          description: Filter by webhook event type
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebhookDelivery'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

# =============================================================================
# Components
# =============================================================================
components:

  # ---------------------------------------------------------------------------
  # Security Schemes
  # ---------------------------------------------------------------------------
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Cognito JWT access token
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Organization-scoped API key

  # ---------------------------------------------------------------------------
  # Reusable Parameters
  # ---------------------------------------------------------------------------
  parameters:
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
      description: Page size (default 50, max 200)

    CursorParam:
      name: cursor
      in: query
      schema:
        type: string
      description: Opaque pagination cursor from a previous response

    MediaSourceFilter:
      name: mediaSource[]
      in: query
      schema:
        type: array
        items:
          type: string
          enum: [drone, screenshot, upload, contractor, cvat_crop]
      description: >-
        Optional allowlist applied to expanded `media` rows. When supplied,
        only `mission_media` rows whose `source` is in the list are returned
        in the expanded `media` field; non-media expansions (e.g. `site`,
        `cluster`) ignore the filter. Empty/omitted means no filtering. The
        dashboard's site-level photo carousel uses this to keep `cvat_crop`
        derivative crops out while still letting `/asset-inspections`
        surface them under `asset_inspection_media`. Allowed values mirror
        the `mission_media.source` CHECK constraint.

    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: >-
        Idempotency key for POST requests. If a transaction with the same key
        already exists for the org, the server returns the original response
        without re-executing. Keys are valid for 48 hours.

  # ---------------------------------------------------------------------------
  # Reusable Headers
  # ---------------------------------------------------------------------------
  headers:
    XRequestId:
      description: Unique request identifier (UUID)
      schema:
        type: string
        format: uuid

  # ---------------------------------------------------------------------------
  # Reusable Responses
  # ---------------------------------------------------------------------------
  responses:
    BadRequest:
      description: Bad request or validation error
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: Authentication required
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: Insufficient permissions
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Resource not found
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Conflict:
      description: Conflict (duplicate resource, in-use resource, or undo conflict)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    TooManyRequests:
      description: Rate limit exceeded
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        X-RateLimit-Limit:
          schema:
            type: integer
          description: Maximum requests per window
        X-RateLimit-Remaining:
          schema:
            type: integer
          description: Requests remaining in current window
        X-RateLimit-Reset:
          schema:
            type: number
          description: Unix timestamp (ms) when the window resets
        Retry-After:
          schema:
            type: integer
          description: Seconds until the next rate limit window
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    InternalError:
      description: Internal server error
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  # ---------------------------------------------------------------------------
  # Schemas
  # ---------------------------------------------------------------------------
  schemas:

    # -------------------------------------------------------
    # Error envelope
    # -------------------------------------------------------
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Machine-readable error code
            message:
              type: string
              description: Human-readable description
            details:
              type: object
              additionalProperties: true
              description: Optional structured info (e.g. field-level validation errors, conflictingEventIds)

    # -------------------------------------------------------
    # Pagination meta
    # -------------------------------------------------------
    PaginationMeta:
      type: object
      required: [cursor]
      properties:
        cursor:
          type: string
          nullable: true
          description: Opaque cursor for the next page; null when no more results
        total:
          type: integer
          description: Total matching results across all pages; included when cheaply computable

    # -------------------------------------------------------
    # GeoJSON Geometry Types
    # -------------------------------------------------------
    PointGeometry:
      type: object
      required: [type, coordinates]
      properties:
        type:
          type: string
          enum: [Point]
        coordinates:
          type: array
          description: "[longitude, latitude] or [longitude, latitude, altitude]"
          items:
            type: number
          minItems: 2
          maxItems: 3

    LineStringGeometry:
      type: object
      required: [type, coordinates]
      properties:
        type:
          type: string
          enum: [LineString]
        coordinates:
          type: array
          items:
            type: array
            items:
              type: number
            minItems: 2
            maxItems: 3
          minItems: 2

    PolygonGeometry:
      type: object
      required: [type, coordinates]
      properties:
        type:
          type: string
          enum: [Polygon]
        coordinates:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: number
              minItems: 2
              maxItems: 3
            minItems: 4

    MultiLineStringGeometry:
      type: object
      required: [type, coordinates]
      properties:
        type:
          type: string
          enum: [MultiLineString]
        coordinates:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: number
              minItems: 2
              maxItems: 3
            minItems: 2

    SiteGeometry:
      description: GeoJSON geometry for sites (Point, LineString, or Polygon)
      oneOf:
        - $ref: '#/components/schemas/PointGeometry'
        - $ref: '#/components/schemas/LineStringGeometry'
        - $ref: '#/components/schemas/PolygonGeometry'
      discriminator:
        propertyName: type
        mapping:
          Point: '#/components/schemas/PointGeometry'
          LineString: '#/components/schemas/LineStringGeometry'
          Polygon: '#/components/schemas/PolygonGeometry'

    ClusterGeometry:
      description: GeoJSON geometry for clusters (Polygon, LineString, or MultiLineString)
      oneOf:
        - $ref: '#/components/schemas/PolygonGeometry'
        - $ref: '#/components/schemas/LineStringGeometry'
        - $ref: '#/components/schemas/MultiLineStringGeometry'
      discriminator:
        propertyName: type
        mapping:
          Polygon: '#/components/schemas/PolygonGeometry'
          LineString: '#/components/schemas/LineStringGeometry'
          MultiLineString: '#/components/schemas/MultiLineStringGeometry'

    # -------------------------------------------------------
    # Shared value types
    # -------------------------------------------------------
    PointSiteType:
      type: string
      enum:
        - distribution_pole
        - transmission_pole
        - substation
        - other

    AreaSiteType:
      type: string
      enum:
        - utility_substation
        - other

    LineSiteType:
      type: string
      enum:
        - transmission_line
        - distribution_line
        - pipeline
        - railway
        - road
        - other

    SiteType:
      type: string
      description: Union of PointSiteType, AreaSiteType, and LineSiteType
      enum:
        - distribution_pole
        - transmission_pole
        - substation
        - utility_substation
        - transmission_line
        - distribution_line
        - pipeline
        - railway
        - road
        - other

    AssetPriority:
      type: string
      enum: [high, medium, low, none]

    ClusterLevel:
      type: integer
      minimum: 1
      maximum: 3
      description: "1 = coarsest, 3 = finest"

    MissionStatus:
      type: string
      enum: [scheduled, canceled, in-progress, recurring, complete]

    DetailLevel:
      type: string
      enum: [low, medium, high]

    Recurrence:
      type: string
      enum: [daily, weekly, monthly, yearly]

    SensorRequirement:
      type: string
      enum:
        - hi-def
        - any
        - "no"

    LidarRequirement:
      type: string
      enum:
        - "yes"
        - "no"
        - any

    ThermalRequirement:
      type: string
      enum:
        - 640x480
        - any
        - "no"

    MediaType:
      type: string
      enum: [image, video]

    CaptureType:
      type: string
      nullable: true
      enum: [rgb, thermal]
      description: Spectral modality of the frame, served directly from mission_media.capture_type (the single source of truth). null means the modality is unknown (not yet classified); it is never coerced to rgb.

    SiteVisitStatus:
      type: string
      enum: [pending, in-progress, complete, skipped, failed]

    ClusterVisitStatus:
      type: string
      enum: [pending, in-progress, complete]

    UserStatus:
      type: string
      enum: [active, invited, deactivated]

    TransactionStatus:
      type: string
      enum: [committed, undone]

    EventResourceType:
      type: string
      enum:
        - site
        - cluster
        - mission
        - cluster_visit
        - site_visit
        - mission_media
        - asset
        - defect
        - site_inspection
        - asset_inspection
        - organization
        - user
        - role
        - api_key
        - webhook

    EventActionType:
      type: string
      enum: [create, update, delete]

    PermissionResource:
      type: string
      enum:
        - sites
        - missions
        - media
        - organization
        - users
        - roles
        - billing
        - developer
        - events
        - transactions

    PermissionLevel:
      type: string
      enum: [none, read, write]

    WebhookEvent:
      type: string
      enum:
        - mission.scheduled
        - mission.started
        - mission.completed
        - mission.failed
        - processing.started
        - processing.completed

    # -------------------------------------------------------
    # Supporting object types
    # -------------------------------------------------------
    Address:
      type: object
      required: [street, city, state, zip, country]
      properties:
        street:
          type: string
        city:
          type: string
        state:
          type: string
        zip:
          type: string
        country:
          type: string

    CameraOrientation:
      type: object
      required: [center, zoom, bearing, pitch]
      properties:
        center:
          type: array
          description: "[longitude, latitude]"
          items:
            type: number
          minItems: 2
          maxItems: 2
        zoom:
          type: number
        bearing:
          type: number
        pitch:
          type: number

    LineProperties:
      type: object
      required: [geometryType, width]
      properties:
        geometryType:
          type: string
          enum: [line]
        width:
          type: number

    SiteProperties:
      description: Site-type-specific properties; currently only LineProperties
      oneOf:
        - $ref: '#/components/schemas/LineProperties'

    SensorRequirements:
      type: object
      required: [camera, lidar, thermal]
      properties:
        camera:
          $ref: '#/components/schemas/SensorRequirement'
        lidar:
          $ref: '#/components/schemas/LidarRequirement'
        thermal:
          $ref: '#/components/schemas/ThermalRequirement'

    Permission:
      type: object
      required: [resource, level]
      properties:
        resource:
          $ref: '#/components/schemas/PermissionResource'
        level:
          $ref: '#/components/schemas/PermissionLevel'

    GeometryCounts:
      type: object
      required: [point, line, area]
      properties:
        point:
          type: integer
        line:
          type: integer
        area:
          type: integer

    GeoLocation:
      type: object
      required: [lat, lng]
      properties:
        lat:
          type: number
        lng:
          type: number
        altitude:
          type: number

    GimbalOrientation:
      type: object
      required: [yaw, pitch, roll]
      properties:
        yaw:
          type: number
          description: Gimbal yaw in degrees
        pitch:
          type: number
          description: Gimbal pitch in degrees
        roll:
          type: number
          description: Gimbal roll in degrees

    Resolution:
      type: object
      required: [width, height]
      properties:
        width:
          type: integer
        height:
          type: integer

    GeoPathPoint:
      type: object
      required: [timestampSec, lat, lng]
      properties:
        timestampSec:
          type: number
        lat:
          type: number
        lng:
          type: number
        altitude:
          type: number

    # -------------------------------------------------------
    # Domain models
    # -------------------------------------------------------
    Organization:
      type: object
      required: [id, name, featureFlags, deletedAt, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        logoUrl:
          type: string
        contactEmail:
          type: string
        address:
          $ref: '#/components/schemas/Address'
        featureFlags:
          type: object
          description: >
            Per-organization feature flags. Keys are camelCase flag names,
            values are typed (currently only booleans). A missing key means
            the feature is off; each consumer documents its own default at
            the read site. Known keys:
              - fakeDroneVideo (boolean): when true, ViewMissionPage shows the
                demo drone video loop for missions whose status is
                "in-progress". Defaults to off when missing.
          additionalProperties: true
        deletedAt:
          type: number
          nullable: true
          description: Soft-delete Unix timestamp in milliseconds; null if not deleted
        createdAt:
          type: number
          description: Unix timestamp in milliseconds
        updatedAt:
          type: number
          description: Unix timestamp in milliseconds

    Role:
      type: object
      required: [id, name, description, permissions, isSystem, canSwitchOrganizations, deletedAt, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
          nullable: true
          description: "NULL for global roles (e.g. super-admin)"
        slug:
          type: string
          nullable: true
          description: "Stable identifier for the super-admin role"
        name:
          type: string
        description:
          type: string
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
        isSystem:
          type: boolean
        canSwitchOrganizations:
          type: boolean
        deletedAt:
          type: number
          nullable: true
        createdAt:
          type: number
        updatedAt:
          type: number

    User:
      type: object
      required: [id, actorId, cognitoId, firstName, lastName, email, status, deletedAt, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        actorId:
          type: string
          format: uuid
        cognitoId:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        phone:
          type: string
        avatarUrl:
          type: string
        status:
          $ref: '#/components/schemas/UserStatus'
        invitedAt:
          type: number
          nullable: true
        joinedAt:
          type: number
          nullable: true
        deletedAt:
          type: number
          nullable: true
        createdAt:
          type: number
        updatedAt:
          type: number

    Site:
      type: object
      required: [type, id, organizationId, name, siteType, geometry, deletedAt, createdAt, updatedAt]
      properties:
        type:
          type: string
          enum: [Feature]
          description: GeoJSON Feature type constant
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        externalId:
          type: string
          description: Optional customer-facing identifier
        name:
          type: string
        siteType:
          $ref: '#/components/schemas/SiteType'
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        clusterId:
          type: string
          format: uuid
        cameraOrientation:
          $ref: '#/components/schemas/CameraOrientation'
        geometry:
          $ref: '#/components/schemas/SiteGeometry'
        properties:
          $ref: '#/components/schemas/SiteProperties'
        priority:
          $ref: '#/components/schemas/AssetPriority'
          description: Read-only; derived from highest-severity defect
        deletedAt:
          type: number
          nullable: true
        createdAt:
          type: number
        updatedAt:
          type: number

    Cluster:
      type: object
      required: [id, organizationId, count, parentId, level, siteTypes, geometryCounts, name, centroid, bounds, geometry, deletedAt, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        count:
          type: integer
        parentId:
          type: string
          format: uuid
          nullable: true
        level:
          $ref: '#/components/schemas/ClusterLevel'
        siteTypes:
          type: array
          items:
            type: string
        geometryCounts:
          $ref: '#/components/schemas/GeometryCounts'
        name:
          type: string
        centroid:
          type: array
          description: "[longitude, latitude]"
          items:
            type: number
          minItems: 2
          maxItems: 2
        bounds:
          type: array
          description: "[minLng, minLat, maxLng, maxLat]"
          items:
            type: number
          minItems: 4
          maxItems: 4
        geometry:
          $ref: '#/components/schemas/ClusterGeometry'
        deletedAt:
          type: number
          nullable: true
        createdAt:
          type: number
        updatedAt:
          type: number

    Mission:
      type: object
      required: [id, organizationId, name, description, status, detailLevel, sensors, createdAt, scheduledFor, estimatedCompletionTime, estimatedCost, siteCount, deletedAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/MissionStatus'
        detailLevel:
          $ref: '#/components/schemas/DetailLevel'
        sensors:
          $ref: '#/components/schemas/SensorRequirements'
        createdAt:
          type: number
        scheduledFor:
          type: number
        estimatedCompletionTime:
          type: number
        dueDate:
          type: number
        recurrence:
          $ref: '#/components/schemas/Recurrence'
        estimatedCost:
          type: number
        siteGeometries:
          type: array
          items:
            type: string
            enum: [point, line, area]
        siteCount:
          type: integer
          description: Total number of active site visits in this mission
        bounds:
          type: array
          description: |
            Bounding box of all active site geometries in this mission,
            as [minLng, minLat, maxLng, maxLat]. Null when the mission has
            no active site visits.
          items:
            type: number
          minItems: 4
          maxItems: 4
          nullable: true
        deletedAt:
          type: number
          nullable: true
        updatedAt:
          type: number

    ClusterVisit:
      type: object
      required: [id, organizationId, missionId, clusterId, siteCount, completedCount, status, deletedAt, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        missionId:
          type: string
          format: uuid
        clusterId:
          type: string
          format: uuid
        siteCount:
          type: integer
        completedCount:
          type: integer
        status:
          $ref: '#/components/schemas/ClusterVisitStatus'
        deletedAt:
          type: number
          nullable: true
        createdAt:
          type: number
        updatedAt:
          type: number

    SiteVisit:
      type: object
      required: [id, organizationId, missionId, siteId, clusterVisitId, status, completedAt, recaptureReason, recaptureRequestedBy, recaptureRequestedAt, deletedAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        missionId:
          type: string
          format: uuid
        siteId:
          type: string
          format: uuid
        clusterVisitId:
          type: string
          format: uuid
          nullable: true
          description: FK to ClusterVisit; null for unclustered sites
        status:
          $ref: '#/components/schemas/SiteVisitStatus'
        completedAt:
          type: number
          nullable: true
        recaptureReason:
          type: string
          nullable: true
        recaptureRequestedBy:
          type: string
          format: uuid
          nullable: true
          description: actorId of the requester
        recaptureRequestedAt:
          type: number
          nullable: true
        deletedAt:
          type: number
          nullable: true
        createdAt:
          type: number

    CompressedVisitsResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          description: >
            Mixed array of ClusterVisit and SiteVisit objects. Each item
            includes a `type` field: `"clusterVisit"` or `"siteVisit"`.
            ClusterVisit items represent the highest-level clusters whose
            parent cluster does not have a ClusterVisit in the mission.
            SiteVisit items are unclustered site visits.
          items:
            oneOf:
              - allOf:
                  - type: object
                    required: [type]
                    properties:
                      type:
                        type: string
                        enum: [clusterVisit]
                  - $ref: '#/components/schemas/ClusterVisit'
              - allOf:
                  - type: object
                    required: [type]
                    properties:
                      type:
                        type: string
                        enum: [siteVisit]
                  - $ref: '#/components/schemas/SiteVisit'
            discriminator:
              propertyName: type
              mapping:
                clusterVisit: '#/components/schemas/ClusterVisit'
                siteVisit: '#/components/schemas/SiteVisit'
        meta:
          type: object
          required: [totalSiteCount]
          properties:
            totalSiteCount:
              type: integer
              description: Total number of sites represented across all items

    MissionMedia:
      type: object
      required: [id, organizationId, missionId, vehicleId, mediaType, captureType, url, thumbnailUrl, capturedAt, geoLocation, deletedAt, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        missionId:
          type: string
          format: uuid
        vehicleId:
          type: string
          format: uuid
          description: Reference to the vehicle (e.g. drone) that captured this media
        siteId:
          type: string
          format: uuid
        mediaType:
          $ref: '#/components/schemas/MediaType'
        captureType:
          $ref: '#/components/schemas/CaptureType'
        url:
          type: string
          description: Opaque asset URL
        thumbnailUrl:
          type: string
        capturedAt:
          type: number
        captureDevice:
          type: string
          description: Camera/sensor used for capture (e.g. "Zenmuse H30T Wide")
        orientation:
          $ref: '#/components/schemas/GimbalOrientation'
        focalLength:
          type: number
          description: Focal length in mm
        digitalZoom:
          type: number
          description: Digital zoom ratio (1.0 = no zoom)
        fov:
          type: number
          description: Diagonal field of view in degrees
        resolution:
          $ref: '#/components/schemas/Resolution'
        geoLocation:
          allOf:
            - $ref: '#/components/schemas/GeoLocation'
          nullable: true
          description: Required for images; null for video
        duration:
          type: number
          description: Video length in seconds
        geoPath:
          type: array
          items:
            $ref: '#/components/schemas/GeoPathPoint'
          description: Video flight path; null for images
        deletedAt:
          type: number
          nullable: true
        createdAt:
          type: number
        updatedAt:
          type: number
        commentCount:
          type: integer
          description: Count of comments attached to this media row.
        thermalRange:
          type: object
          nullable: true
          description: >-
            Compact Fahrenheit min/max thermal scale for lightbox overlays,
            derived from mission_media.metadata thermal stats. This is DATA, not
            a modality classifier (see captureType). null when the frame has no
            thermal stats, so the overlay simply hides.
          properties:
            minTempF:
              type: number
              nullable: true
            maxTempF:
              type: number
              nullable: true
        thermalDisplayRamp:
          type: array
          nullable: true
          description: >-
            Measured per-image display ramp: ordered hex color stops (cold->hot,
            e.g. ["#151515", ..., "#f7f7f7"]) recovered by correlating the
            frame's temperature grid with its rendered pixels. The client renders
            these stops directly as the thermal scale-bar gradient (top=hot), so
            the bar matches the frame's actual pixels for any palette — including
            Skydio's per-image isotherm overlay, which a palette name cannot
            describe. This is a DISPLAY fact, distinct from captureType (spectral
            modality) and thermalRange (temperature data). null when the frame has
            no measured ramp, so the overlay hides.
          items:
            type: string

    MediaComment:
      type: object
      required: [id, mediaId, text, createdAt, actor]
      properties:
        id:
          type: string
          format: uuid
        mediaId:
          type: string
          format: uuid
        text:
          type: string
        createdAt:
          type: number
        actor:
          type: object
          required: [id, type]
          properties:
            id:
              type: string
              format: uuid
            type:
              type: string
              enum: [user, api_key, system]
            user:
              nullable: true
              type: object
              required: [id, firstName, lastName, email]
              properties:
                id:
                  type: string
                  format: uuid
                firstName:
                  type: string
                lastName:
                  type: string
                email:
                  type: string
                avatarUrl:
                  type: string
                  nullable: true

    Asset:
      type: object
      required: [id, organizationId, siteId, name, priority, deletedAt, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        siteId:
          type: string
          format: uuid
        name:
          type: string
        priority:
          $ref: '#/components/schemas/AssetPriority'
        deletedAt:
          type: number
          nullable: true
        createdAt:
          type: number
        updatedAt:
          type: number

    Defect:
      type: object
      required: [id, organizationId, assetId, assetInspectionId, assetType, defectName, defectPriority, prioritySource, workDoneAt, deletedAt, createdAt]
      description: |
        Merged defect. One row per (assetInspectionId, defectName) at a
        time. Per-CVAT-shape evidence (bbox, evidence photo, original
        per-shape description) lives on DefectEvidence and is exposed via
        `expand[]=evidence` (or, on listInspections,
        `expand[]=asset.defects.evidence`). The `description` field on
        this schema is the denormalized "longest non-empty live evidence
        description" cache maintained by the CVAT export.
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        assetId:
          type: string
          format: uuid
        assetInspectionId:
          type: string
          format: uuid
        assetType:
          type: string
        defectName:
          type: string
        defectPriority:
          type: integer
          minimum: 1
          maximum: 4
          description: "1 = highest severity, 4 = none/normal"
        prioritySource:
          type: string
          enum: [mapping, manual, cvat_other_defect]
          description: |
            Where `defectPriority` came from. Bulk schema edits only
            touch rows where `prioritySource='mapping'` so reviewer
            manual overrides survive. `cvat_other_defect` is excluded
            because that priority is contractor-self-rated per shape,
            not derived from the org-wide schema.
        defectPriorityMappingId:
          type: string
          format: uuid
          nullable: true
          description: "Active defect_priority_mappings.id at the time defectPriority was last derived. Informational/audit; nullable on legacy rows imported before this column existed."
        workDoneAt:
          type: number
          nullable: true
          description: "Unix ms timestamp marking this defect as addressed in the field. Null while unaddressed. When non-null, the defect is excluded from the asset priority rollup."
        reviewedAt:
          type: number
          nullable: true
          description: "Unix ms timestamp the customer marked this defect reviewed (the 'Reviewed by' mark). Null when not reviewed. Set/cleared via PATCH /defects/{id} { reviewed }."
        reviewedByName:
          type: string
          nullable: true
          description: "Display name of the actor who set the current reviewed state. Null when not reviewed; empty string for api-key actors with no user row. Resolved from reviewedByActorId; present on list/expand reads, omitted on the mutation response."
        description:
          type: string
          nullable: true
          description: "Longest non-empty `description` across the parent's live DefectEvidence rows. Maintained by the CVAT export — the API and UI read this column directly rather than aggregating across evidence on every fetch."
        deletedAt:
          type: number
          nullable: true
        createdAt:
          type: number
        evidence:
          type: array
          description: "Populated only when `evidence` is requested via expand[]. Otherwise omitted."
          items:
            $ref: '#/components/schemas/DefectEvidence'

    DefectPriorityMapping:
      type: object
      required: [id, organizationId, mapping, version, isActive]
      description: |
        Per-org JSONB rule set mapping a CVAT
        `(Equipment, Type, Defect)` tuple to an `asset_type` and a
        `priority` integer (1..4). One active row per organization at a
        time; saving a new version deactivates the prior active row.
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        mapping:
          type: object
          description: |
            `{ "<Equipment>": { "<Type>": { "asset_type": "<slug>", "defects": { "<Defect>": <int 1-4> } } } }`.
            Use `"n/a"` as the `<Type>` key for CVAT labels with no
            real subtype.
        version:
          type: integer
        isActive:
          type: boolean

    DefectEvidence:
      type: object
      required: [id, defectId, reviewUncertain, deletedAt, createdAt]
      description: |
        Per-CVAT-shape evidence row tied to a Defect (merged defect).
        Multiple rows for the same Defect mean the same defect was
        annotated across multiple photos. Returned from the API only when
        explicitly expanded.
      properties:
        id:
          type: string
          format: uuid
        defectId:
          type: string
          format: uuid
        cvatShapeUid:
          type: string
          nullable: true
          description: "Stable id `<cvat_task_id>:<cvat_shape_id>` of the source CVAT shape. NULL on non-CVAT-sourced rows (none today)."
        evidenceMediaId:
          type: string
          format: uuid
          nullable: true
          description: "Original (uncropped) mission_media row that the lineman annotated."
        bbox:
          type: object
          nullable: true
          description: 'Bounding box in evidence_media_id pixel coordinates: {"x1": int, "y1": int, "x2": int, "y2": int}.'
        description:
          type: string
          nullable: true
          description: "Free-form text the lineman attached to this specific CVAT shape (Comment attribute on regular labels, Description on the Other catch-all)."
        reviewUncertain:
          type: boolean
          description: "True when this shipped evidence crop came from QA consensus=agreed_uncertain. The customer platform rolls this up to an Uncertain tag on the merged defect."
        deletedAt:
          type: number
          nullable: true
        createdAt:
          type: number

    SiteInspection:
      type: object
      required: [id, organizationId, siteId, missionId, status, deletedAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        siteId:
          type: string
          format: uuid
        missionId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - planned
            - capture-pending
            - capture-submitted
            - capture-verified
            - capture-failed
            - analysis-pending
            - analysis-submitted
            - analysis-verified
            - analysis-failed
            - delivered
          description: >-
            FSM lifecycle state of this inspection (see the inspections
            consolidation state machine). Defaults to `planned`. Not yet
            transitioned by writers in this release.
        status_metadata:
          type: object
          nullable: true
          additionalProperties: true
          description: Failure details, legacy provenance, or not-capturable kind; null unless set.
        deletedAt:
          type: number
          nullable: true
        createdAt:
          type: number
        not_capturable:
          type: boolean
          description: >-
            True only for synthesized "not capturable" placeholder rows
            returned when `includeUncapturable=true` (the site is tagged
            `inaccessible` and no media was captured); these have no
            backing site_inspections row (the id reuses the site id, so
            do not refetch via GET /inspections/{id}). Absent/false for
            real inspections.

    AssetInspection:
      type: object
      required: [id, organizationId, assetId, missionId, siteInspectionId, deletedAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        assetId:
          type: string
          format: uuid
        missionId:
          type: string
          format: uuid
        siteInspectionId:
          type: string
          format: uuid
        deletedAt:
          type: number
          nullable: true
        createdAt:
          type: number

    Event:
      type: object
      required: [id, organizationId, transactionId, resourceType, resourceId, resourceIds, resourceName, action, actorId, actorType, actorName, actorRoleName, actorIsSuperAdmin, timestamp, before, after]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        transactionId:
          type: string
          format: uuid
        resourceType:
          $ref: '#/components/schemas/EventResourceType'
        resourceId:
          type: string
          format: uuid
          nullable: true
          description: Single resource; null for bulk events
        resourceIds:
          type: array
          nullable: true
          items:
            type: string
            format: uuid
          description: Bulk events; null for single-resource events
        resourceName:
          type: string
        action:
          $ref: '#/components/schemas/EventActionType'
        actorId:
          type: string
          format: uuid
        actorType:
          type: string
          enum: [user, api_key, system]
          nullable: true
          description: Type of the actor (resolved at read time). Null if the actor row is not visible under the current org RLS scope (e.g. a Voltair super admin who has since switched to a different organization).
        actorName:
          type: string
          nullable: true
          description: "Display name for the actor: 'first last' for users, api_key name for api_keys, 'System' for system actors. Null when the actor row is not resolvable."
        actorRoleName:
          type: string
          nullable: true
          description: Name of the actor's role (e.g. 'Admin', 'Super Admin'). Null when the role row is not resolvable.
        actorIsSuperAdmin:
          type: boolean
          nullable: true
          description: True when the actor's role slug is 'super-admin'. Used by the UI to render 'Voltair Admin' instead of the underlying user's name.
        timestamp:
          type: number
        before:
          type: object
          nullable: true
          additionalProperties: true
          description: "Null for create; delta for update; full row for delete"
        after:
          type: object
          nullable: true
          additionalProperties: true
          description: "Full row for create; delta for update; null for delete"

    Transaction:
      type: object
      required: [id, organizationId, actorId, description, method, endpoint, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        actorId:
          type: string
          format: uuid
        description:
          type: string
        method:
          type: string
        endpoint:
          type: string
        status:
          $ref: '#/components/schemas/TransactionStatus'
        idempotencyKey:
          type: string
        undoOfTransactionId:
          type: string
          format: uuid
          description: If this IS an undo, points to the original transaction
        undoneByTransactionId:
          type: string
          format: uuid
          description: If this WAS undone, points to the undo transaction
        createdAt:
          type: number

    ApiKey:
      type: object
      required: [id, actorId, name, prefix, createdBy, deletedAt, createdAt, lastUsedAt, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        actorId:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
          description: 'First 12 characters, safe to display (e.g. "sk_live_a1b2")'
        createdBy:
          type: string
          format: uuid
          description: User ID of the creator
        deletedAt:
          type: number
          nullable: true
        createdAt:
          type: number
        lastUsedAt:
          type: number
          nullable: true
        expiresAt:
          type: number
          nullable: true

    ApiKeyWithRawKey:
      description: API key returned on creation, including the raw key shown only once
      allOf:
        - $ref: '#/components/schemas/ApiKey'
        - type: object
          required: [rawKey]
          properties:
            rawKey:
              type: string
              description: The raw API key; returned only on creation and cannot be retrieved again

    Webhook:
      type: object
      required: [id, organizationId, url, secret, events, enabled, deletedAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        url:
          type: string
        secret:
          type: string
          description: HMAC-SHA256 signing secret
        events:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEvent'
        enabled:
          type: boolean
        deletedAt:
          type: number
          nullable: true
        createdAt:
          type: number

    WebhookDelivery:
      type: object
      required: [id, organizationId, webhookId, event, timestamp, statusCode, responseTimeMs, error]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        webhookId:
          type: string
          format: uuid
        event:
          $ref: '#/components/schemas/WebhookEvent'
        timestamp:
          type: number
        statusCode:
          type: integer
          nullable: true
        responseTimeMs:
          type: integer
          nullable: true
        error:
          type: string
          nullable: true

