  /transactions/{transactionId}/undo:
    parameters:
      - name: transactionId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    post:
      tags: [Transactions]
      operationId: undoTransaction
      summary: Undo transaction
      description: >-
        Atomically reverses all events in the transaction, creating a new
        transaction representing the inverse operation. Actors with
        transactions:read can undo their own transactions; transactions:write
        can undo any actor's. Returns 409 if field-level conflicts exist and
        force is not set. Returns 400 if the transaction is already undone.
      parameters:
        - name: force
          in: query
          schema:
            type: boolean
          description: >-
            When true, applies the undo regardless of field-level conflicts,
            overwriting intervening changes.
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      responses:
        '200':
          description: Success — returns the newly created undo transaction
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [data, transactionId]
                properties:
                  data:
                    $ref: '#/components/schemas/Transaction'
                  transactionId:
                    type: string
                    format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            Field-level conflicts exist. The error details include the
            conflicting event IDs.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

