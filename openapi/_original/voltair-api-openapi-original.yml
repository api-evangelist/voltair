openapi: 3.0.3
info:
  title: Voltair API
  version: 0.1.0
  description: >-
    Infrastructure inspection platform API. All endpoints are scoped to the
    authenticated organization via Bearer JWT or API key.

    All timestamp fields on this API (createdAt, updatedAt, scheduledFor,
    capturedAt, expiresAt, deletedAt, etc.) are Unix timestamps in
    milliseconds since the epoch (UTC). Both request and response bodies use
    this representation.

servers:
  - url: /

security:
  - BearerAuth: []
  - ApiKeyAuth: []

tags:
  - name: Organization
  - name: Roles
  - name: Users
  - name: Sites
  - name: Assets
  - name: Clusters
  - name: Missions
  - name: ClusterVisits
  - name: SiteVisits
  - name: Media
  - name: Inspections
  - name: Events
  - name: Transactions
  - name: ApiKeys
  - name: Webhooks

paths:
  # ---------------------------------------------------------------------------
  # Organization
  # ---------------------------------------------------------------------------
  /organization:
    get:
      tags: [Organization]
      operationId: getOrganization
      summary: Get organization
      description: Returns the organization for the authenticated caller.
      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

    put:
      tags: [Organization]
      operationId: updateOrganization
      summary: Update organization
      description: Updates organization details. Cannot edit id or createdAt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationRequest'
      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [data, transactionId]
                properties:
                  data:
                    $ref: '#/components/schemas/Organization'
                  transactionId:
                    type: string
                    format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  # ---------------------------------------------------------------------------
  # Identity
  # ---------------------------------------------------------------------------
  /me:
    get:
      tags: [Identity]
      operationId: getMe
      summary: Get authenticated caller
      description: >-
        Returns the user row, role row, and resolved permission list for
        the authenticated caller, derived from the auth context's own
        `auth_lookup_by_cognito_id`. Unlike `GET /users/{id}` and
        `GET /roles`, this endpoint is keyed to the JWT (not to the
        currently viewed organization), so it works for super-admins
        whose user/role rows live in the cluster-internal org but who
        are viewing a different tenant. Authenticated callers always
        have permission to read their own identity, so the route is
        not gated by a `Requires(...)` permission check.
      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [user, role, permissions]
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                      role:
                        $ref: '#/components/schemas/Role'
                      permissions:
                        type: array
                        items:
                          $ref: '#/components/schemas/Permission'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  # ---------------------------------------------------------------------------
  # Roles
  # ---------------------------------------------------------------------------
  /roles:
    get:
      tags: [Roles]
      operationId: listRoles
      summary: List roles
      description: >-
        Returns roles for the caller's organization. By default only
        org-scoped roles are returned. Pass `include=cluster` to also include
        cluster-wide roles (those with `organizationId == null`, e.g.
        super-admin and other system-actor roles); these are not assignable
        from the org UI but downstream consumers like the auth-context role
        lookup and the events page need them to resolve cluster-wide role
        IDs.
      parameters:
        - name: include
          in: query
          schema:
            type: string
            enum: [cluster]
          description: >-
            Set to `cluster` to additionally include cluster-wide roles
            (`organizationId == null`). Omit for org-scoped roles only.
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Role'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [Roles]
      operationId: createRole
      summary: Create role
      description: >-
        Creates a custom role. isSystem and canSwitchOrganizations are always
        set to false server-side.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoleRequest'
      responses:
        '201':
          description: Created
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [data, transactionId]
                properties:
                  data:
                    $ref: '#/components/schemas/Role'
                  transactionId:
                    type: string
                    format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /roles/{roleId}:
    parameters:
      - name: roleId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [Roles]
      operationId: getRole
      summary: Get role
      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

    put:
      tags: [Roles]
      operationId: updateRole
      summary: Update role
      description: >-
        Updates a custom role. Returns 403 if the role is a system role.
        Cannot edit id, isSystem, or canSwitchOrganizations.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleRequest'
      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [data, transactionId]
                properties:
                  data:
                    $ref: '#/components/schemas/Role'
                  transactionId:
                    type: string
                    format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [Roles]
      operationId: deleteRole
      summary: Delete role
      description: >-
        Soft-deletes a custom role. Returns 403 if the role is a system role.
        Returns 409 if any active actors are currently assigned this role.
      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [data, transactionId]
                properties:
                  data:
                    $ref: '#/components/schemas/Role'
                  transactionId:
                    type: string
                    format: uuid
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  # ---------------------------------------------------------------------------
  # Users
  # ---------------------------------------------------------------------------
  /users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List users
      description: >-
        Returns users for the caller's organization. Users assigned to a
        cluster-wide role (`role.organizationId == null`, e.g. super-admins)
        are excluded; they belong to no single org's user catalog and the
        org-scoped Users tab does not display them.
      parameters:
        - name: status
          in: query
          schema:
            type: string
          description: Comma-separated statuses (active, invited, deactivated)
        - name: roleId
          in: query
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [Users]
      operationId: createUser
      summary: Invite user
      description: >-
        Invites a new user. Sets status to "invited" and triggers an invitation
        email. Creates an actor record server-side.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Created
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [data, transactionId]
                properties:
                  data:
                    $ref: '#/components/schemas/User'
                  transactionId:
                    type: string
                    format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [Users]
      operationId: getUser
      summary: Get user
      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

    put:
      tags: [Users]
      operationId: updateUser
      summary: Update user
      description: >-
        Updates user profile or role assignment. Cannot edit id, actorId,
        cognitoId, or email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [data, transactionId]
                properties:
                  data:
                    $ref: '#/components/schemas/User'
                  transactionId:
                    type: string
                    format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [Users]
      operationId: deleteUser
      summary: Delete user
      description: >-
        Soft-deletes a user. The user's actor record persists for audit trail
        integrity. Returns 409 if the user has active API keys.
      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [data, transactionId]
                properties:
                  data:
                    $ref: '#/components/schemas/User'
                  transactionId:
                    type: string
                    format: uuid
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/{userId}/deactivate:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    put:
      tags: [Users]
      operationId: deactivateUser
      summary: Deactivate user
      description: Sets user status to "deactivated".
      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [data, transactionId]
                properties:
                  data:
                    $ref: '#/components/schemas/User'
                  transactionId:
                    type: string
                    format: uuid
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/{userId}/reactivate:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    put:
      tags: [Users]
      operationId: reactivateUser
      summary: Reactivate user
      description: Sets a deactivated user's status to "active".
      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [data, transactionId]
                properties:
                  data:
                    $ref: '#/components/schemas/User'
                  transactionId:
                    type: string
                    format: uuid
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /users/{userId}/resend-invitation:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    post:
      tags: [Users]
      operationId: resendInvitation
      summary: Resend invitation
      description: |
        Generates a fresh Cognito temporary password, resets the Cognito user
        back to FORCE_CHANGE_PASSWORD state, and re-sends the invitation email.
        Only valid while the user's status is "invited" — returns 409 Conflict
        once they have accepted the original invitation.
      responses:
        '204':
          description: Invitation re-sent
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  # ---------------------------------------------------------------------------
  # Sites
  # ---------------------------------------------------------------------------
  /sites:
    get:
      tags: [Sites]
      operationId: listSites
      summary: List sites
      parameters:
        - name: clusterId
          in: query
          schema:
            type: string
            format: uuid
        - name: unclustered
          in: query
          schema:
            type: boolean
          description: If true, return only sites with no cluster assignment. Cannot be combined with clusterId.
        - name: externalId
          in: query
          schema:
            type: string
          description: Filter by customer-facing external identifier
        - name: tags
          in: query
          schema:
            type: string
          description: Comma-separated tag values
        - name: priority
          in: query
          schema:
            type: string
          description: Comma-separated priorities (high, medium, low, none)
        - name: siteType
          in: query
          schema:
            type: string
          description: Comma-separated site types (e.g. substation,distribution_pole)
        - name: geometryType
          in: query
          schema:
            type: string
            enum: [Point, LineString, Polygon, MultiLineString, MultiPolygon]
          description: Filter by the GeoJSON geometry type of the site
        - name: q
          in: query
          schema:
            type: string
          description: Case-insensitive substring match against name, externalId, and description
        - name: bounds
          in: query
          schema:
            type: string
          description: "Bounding box: minLng,minLat,maxLng,maxLat"
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/CursorParam'
      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Site'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [Sites]
      operationId: createSite
      summary: Create site
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSiteRequest'
      responses:
        '201':
          description: Created
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [data, transactionId]
                properties:
                  data:
                    $ref: '#/components/schemas/Site'
                  transactionId:
                    type: string
                    format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /sites/bulk:
    post:
      tags: [Sites]
      operationId: bulkCreateSites
      summary: Bulk create sites
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sites]
              properties:
                sites:
                  type: array
                  items:
                    $ref: '#/components/schemas/CreateSiteRequest'
      responses:
        '201':
          description: Created
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [data, transactionId]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Site'
                  transactionId:
                    type: string
                    format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [Sites]
      operationId: bulkDeleteSites
      summary: Bulk delete sites
      description: |-
        Soft-deletes an array of sites by ID. The `ids` array must be
        non-empty and at most 10000 entries; callers that need to delete more
        should submit multiple requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 10000
                  items:
                    type: string
                    format: uuid
      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [data, transactionId]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Site'
                  transactionId:
                    type: string
                    format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /sites/{siteId}:
    parameters:
      - name: siteId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    get:
      tags: [Sites]
      operationId: getSite
      summary: Get site
      responses:
