  /defects/{defectId}:
    parameters:
      - name: defectId
        in: path
        required: true
        schema:
          type: string
          format: uuid

    patch:
      tags: [Assets]
      operationId: updateDefect
      summary: Update a defect
      description: |
        Partial update of one or more mutable fields:
          * `workDoneAt` -- Unix ms to mark the defect as addressed,
            null to clear the mark (undo).
          * `defectPriority` -- 1..4. Sending this field always sets
            `prioritySource='manual'` so a subsequent bulk schema edit
            cannot overwrite the reviewer's decision. May be sent
            standalone; sending `prioritySource: 'manual'` alongside
            is allowed but redundant.
          * `prioritySource: 'mapping'` (alone, without
            `defectPriority`) -- revert path. Re-derives
            `defectPriority` from the org's active
            `defect_priority_mappings` entry for this row's
            `(asset_type, defect_name)` tuple. 409 with
            `code='no_mapping_baseline'` if no live row in the same
            tuple currently carries a mapping-derived priority (the
            schema must be updated or the CVAT export re-run before a
            revert can succeed).
          * `prioritySource: 'cvat_other_defect'` -- read-only via
            this endpoint; only the CVAT export can assign that source.
          * `reviewed` -- bool. true stamps `reviewedAt=now()` and
            `reviewedByActorId=<caller>` (the customer-portal "Reviewed
            by" mark); false clears both. The reviewer identity is taken
            from the auth context, never the body.
        All writes trigger the `stream_priority_defects` database
        trigger, which cascades through voltair-streams-priority to
        recompute the owning asset and (if changed) site priority.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                workDoneAt:
                  type: number
                  nullable: true
                  description: "Unix ms timestamp. Null clears the field."
                defectPriority:
                  type: integer
                  minimum: 1
                  maximum: 4
                  description: "Manual priority override. Sets prioritySource='manual'."
                prioritySource:
                  type: string
                  enum: [manual, mapping]
                  description: |
                    Sent alone with value 'mapping' to revert a manual
                    override (re-derives priority from the active
                    mapping). Sent with defectPriority and value
                    'manual' is allowed but redundant -- defectPriority
                    alone implies manual.
                reviewed:
                  type: boolean
                  description: |
                    Customer-portal "Reviewed by" mark. true stamps
                    reviewedAt + reviewedByActorId from the auth context;
                    false clears both.
      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [data, transactionId]
                properties:
                  data:
                    $ref: '#/components/schemas/Defect'
                  transactionId:
                    type: string
                    format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /defects:bulk-priority:
    post:
      tags: [Assets]
      operationId: bulkUpdateDefectPriority
      summary: Bulk-update defect priority for a single (assetType, defectName) tuple
      description: |
        Remaps every existing defect row in the caller's organization
        whose `(assetType, defectName)` matches the request to a new
        priority. Optionally also rewrites the org's active
        `defect_priority_mapping` so future CVAT exports use the new
        value as the schema-derived default.

        Reviewer manual overrides are NEVER touched -- the bulk UPDATE
        filters by `priority_source='mapping'`. CVAT "Other" catch-all rows
        (`priority_source='cvat_other_defect'`) are also excluded.

        At least one of `applyToExisting` or `alsoUpdateMapping` must be
        true (otherwise the request is a no-op and is rejected).

        Permission: `defects:write`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assetType, defectName, priority]
              properties:
                assetType:
                  type: string
                  description: "Slug of the asset_type column (e.g. 'wood_pole')."
                defectName:
                  type: string
                  description: "Composed defect_name string (e.g. 'Pole (Wood): Crack/Split - major')."
                priority:
                  type: integer
                  minimum: 1
                  maximum: 4
                applyToExisting:
                  type: boolean
                  default: false
                  description: "When true, update every matching mapping-derived defect row in the org."
                alsoUpdateMapping:
                  type: boolean
                  default: false
                  description: "When true, also bump defect_priority_mappings to a new active version with this tuple's priority changed."
      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [data, transactionId]
                properties:
                  data:
                    type: object
                    required: [defectsUpdated, assetsRecomputed, sitesRecomputed]
                    properties:
                      defectsUpdated:
                        type: integer
                      assetsRecomputed:
                        type: integer
                      sitesRecomputed:
                        type: integer
                      mappingVersion:
                        type: integer
                        description: "Present only when alsoUpdateMapping=true."
                      mappingId:
                        type: string
                        format: uuid
                        description: "Present only when alsoUpdateMapping=true."
                  transactionId:
                    type: string
                    format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: "alsoUpdateMapping=true but the active mapping has no entry for (assetType, defectName)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /defect-priority-mapping:
    get:
      tags: [Assets]
      operationId: getDefectPriorityMapping
      summary: Get the active defect priority mapping for the caller's organization
      description: |
        Returns the active row from `app.defect_priority_mappings` (a
        per-org JSONB schema mapping `(Equipment, Type, Defect)` to
        `(asset_type, priority)`). 404 when none exists; the org must be
        seeded via the admin API before customer-facing edits are allowed.

        Permission: `defects:read`.
      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/DefectPriorityMapping'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

    put:
      tags: [Assets]
      operationId: putDefectPriorityMapping
      summary: Replace the active defect priority mapping (priority values only)
      description: |
        Versioned write: deactivates the prior active row and inserts a
        new one with `version+1`. Customer-facing edits are LIMITED TO
        priority values: the `(Equipment, Type, Defect)` keyset is
        immutable from this endpoint. Adding or removing keys requires a
        super-admin re-import via the admin API after the CVAT project
        schema is updated -- 409 with `code='schema_keys_immutable'`
        when the request would change the keyset.

        Optional `applyToExisting` (default false) bulk-rewrites every
        existing defect row whose `(asset_type, defect_name)`
        tuple has a changed priority value, while preserving rows
        marked `priority_source='manual'`.

        Permission: `defects:write`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mapping]
              properties:
                mapping:
                  type: object
                  description: |
                    Three-level Equipment / Type / Defect JSONB. See
                    voltair-admin-api/src/service/defect_priority_mapping.go::validateMappingShape
                    for the canonical shape; it is enforced server-side.
                applyToExisting:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Success
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                type: object
                required: [data, transactionId]
                properties:
                  data:
                    type: object
                    required: [id, version, mapping, defectsUpdated, assetsRecomputed, sitesRecomputed]
                    properties:
                      id:
                        type: string
                        format: uuid
                      version:
                        type: integer
                      mapping:
                        type: object
                      defectsUpdated:
                        type: integer
                      assetsRecomputed:
                        type: integer
                      sitesRecomputed:
                        type: integer
                  transactionId:
                    type: string
                    format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: "Mapping keyset differs from the active version (or asset_type changed)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

