      type: object
      required: [missionId, vehicleId, source, mediaType, capturedAt, sizeBytes]
      properties:
        missionId:
          type: string
          format: uuid
        vehicleId:
          type: string
          format: uuid
        source:
          type: string
          description: Free-form tag describing how the media reached the API (e.g. "contractor-upload", "screenshot").
        mediaType:
          $ref: '#/components/schemas/MediaType'
