  - {name: AssetInspection, domain: inspections, description: Inspection outcome for one asset within a site inspection.}
  - {name: Event, domain: platform, description: Audit-log entry (actor, action, before/after deltas) per resource.}
  - {name: Transaction, domain: platform, description: Record of a mutating API call (idempotencyKey), reversible via undo.}
  - {name: Webhook, domain: platform, description: Outbound event subscription with HMAC-SHA256 signing secret.}
  - {name: WebhookDelivery, domain: platform, description: Delivery attempt log for a webhook (statusCode, responseTimeMs, error).}

